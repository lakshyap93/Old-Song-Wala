<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Old Song Wala ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #160f0a;
      color: #f7e6c4;
    }

    /* =========================================
       BACKGROUND
    ========================================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -5;

      background:
        linear-gradient(
          rgba(20, 12, 7, 0.18),
          rgba(20, 12, 7, 0.65)
        ),
        url("old-song-wala-bg.webp")
        center center / cover no-repeat;

      transform: scale(1.02);
    }

    /* Cinematic dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: -4;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255, 216, 160, 0.08),
          transparent 40%
        ),
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.55)
        );
    }

    /* Vintage film grain */
    .grain {
      position: fixed;
      inset: -50%;
      z-index: 20;
      pointer-events: none;

      opacity: 0.06;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

      animation: grain 0.25s steps(2) infinite;
    }

    @keyframes grain {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(2%, -2%);
      }

      50% {
        transform: translate(-2%, 2%);
      }

      75% {
        transform: translate(1%, 2%);
      }

      100% {
        transform: translate(-1%, -1%);
      }
    }

    /* =========================================
       MAIN
    ========================================= */

    .page {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;

      padding: 55px 25px 25px;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      text-align: center;

      animation: fadeDown 1.2s ease both;
    }

    .small-label {
      display: inline-block;

      margin-bottom: 10px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;

      color: rgba(255, 232, 195, 0.7);
    }

    .title {
      font-size: clamp(55px, 8vw, 105px);
      line-height: 0.9;

      font-weight: 700;

      color: #f8e4bc;

      text-shadow:
        0 4px 0 rgba(70, 40, 20, 0.4),
        0 10px 35px rgba(0, 0, 0, 0.55);

      letter-spacing: -3px;
    }

    .subtitle {
      margin-top: 15px;

      font-size: clamp(16px, 2vw, 23px);
      font-style: italic;

      color: #ead1a5;

      text-shadow: 0 2px 10px #000;
    }

    .heart {
      color: #d94b35;
      display: inline-block;

      animation: heartbeat 1.8s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       CENTER MEMORY
    ========================================= */

    .memory {
      text-align: center;

      margin-top: -30px;

      animation: fadeUp 1.4s ease 0.2s both;
    }

    .memory-line {
      font-size: 14px;
      letter-spacing: 2px;

      color: rgba(255, 230, 193, 0.65);

      text-transform: uppercase;
    }

    .quote {
      min-height: 34px;

      margin-top: 12px;

      font-size: clamp(18px, 2.2vw, 26px);
      font-style: italic;

      color: #f6dfb7;

      text-shadow: 0 2px 12px #000;

      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       SPOTIFY PLAYER
    ========================================= */

    .spotify-container {
      width: min(760px, 100%);

      position: relative;

      animation: playerAppear 1.5s ease 0.4s both;
    }

    .player-label {
      position: absolute;

      top: -22px;
      left: 22px;

      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;

      text-transform: uppercase;

      color: rgba(255, 235, 202, 0.6);
    }

    .spotify-glass {
      padding: 8px;

      border-radius: 24px;

      background: rgba(30, 22, 17, 0.72);

      border: 1px solid rgba(255, 235, 200, 0.2);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
    }

    .spotify-glass:hover {
      transform: translateY(-4px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px rgba(255, 255, 255, 0.1);
    }

    .spotify-glass iframe {
      display: block;

      width: 100%;
      height: 152px;

      border: 0;

      border-radius: 17px;
    }

    @keyframes playerAppear {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       FOOTER
    ========================================= */

    .footer {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 0.6px;
      color: rgba(255, 230, 195, 0.5);
    }

    .footer .love-icon {
      color: #d94b35;
      display: inline-block;
      margin: 0 2px;
    }

    .footer a {
      color: #ead1a5;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }


    /* PWA INSTALL ICON */
    .install-btn {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 100;
      width: 38px;
      height: 38px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 235, 200, 0.22);
      border-radius: 50%;
      background: rgba(25, 18, 13, 0.65);
      color: #f6dfb7;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .install-btn:hover {
      transform: scale(1.08);
      background: rgba(70, 48, 30, 0.8);
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {
      .page {
        padding: 35px 15px 18px;
      }

      .title {
        letter-spacing: -2px;
      }

      .memory {
        margin-top: 0;
      }

      .memory-line {
        font-size: 9px;
        letter-spacing: 1.5px;
      }

      .quote {
        font-size: 17px;
        padding: 0 10px;
      }

      .spotify-container {
        width: 100%;
      }

      .spotify-glass {
        border-radius: 19px;
        padding: 5px;
      }

      .spotify-glass iframe {
        height: 152px;
        border-radius: 15px;
      }

      .player-label {
        top: -19px;
        left: 15px;
        font-size: 8px;
      }

      .install-btn {
        top: 13px;
        right: 13px;
        width: 36px;
        height: 36px;
        font-size: 17px;
      }

     <footer class="footer">
      Made with <span class="love-icon">♥</span> by
      <a href="https://github.com/lakshyap93" target="_blank" rel="noopener noreferrer">
        Lakshya Purohit
      </a>
    </footer>
      }
    }

    /* =========================================================
       PERFORMANCE + MOBILE OPTIMIZATION
       ========================================================= */

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background: #160f0a;
    }

    body {
      min-height: 100dvh;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100dvh;
      height: 100dvh;
      padding:
        max(30px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom));
      contain: layout paint;
    }

    .background {
      transform: none;
      will-change: auto;
      background-position: center center;
      contain: strict;
    }

    /* The animated full-screen SVG noise was one of the biggest
       mobile rendering costs. Keep a static, subtle texture instead. */
    .grain {
      inset: 0;
      opacity: 0.035;
      background-image: none;
      background: radial-gradient(
        circle at 30% 20%,
        rgba(255,255,255,.035) 0 1px,
        transparent 1px
      );
      background-size: 4px 4px;
      animation: none;
      contain: strict;
    }

    .overlay {
      contain: strict;
    }

    .header,
    .memory,
    .spotify-container {
      will-change: auto;
    }

    .title {
      text-wrap: balance;
    }

    .spotify-glass {
      /* Blur is visually nice but expensive on mobile GPUs. */
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgba(30, 22, 17, 0.88);
      box-shadow: 0 14px 35px rgba(0,0,0,.42);
    }

    .spotify-glass:hover {
      transform: none;
      box-shadow: 0 14px 35px rgba(0,0,0,.42);
    }

    /* Smaller, cheaper transitions. */
    .quote {
      transition: opacity .35s ease;
    }

    @media (max-width: 700px) {
      html,
      body {
        width: 100%;
        min-height: 100%;
        overflow: hidden;
      }

      .page {
        justify-content: space-between;
        padding:
          max(28px, env(safe-area-inset-top))
          14px
          max(14px, env(safe-area-inset-bottom));
      }

      .header {
        width: 100%;
        padding-top: 4px;
      }

      .small-label {
        margin-bottom: 8px;
        font-size: 9px;
        letter-spacing: 2.5px;
      }

      .title {
        font-size: clamp(42px, 15vw, 68px);
        line-height: .92;
        letter-spacing: -2px;
      }

      .subtitle {
        margin-top: 10px;
        font-size: clamp(14px, 4.2vw, 19px);
      }

      .memory {
        width: min(100%, 390px);
        margin-top: 0;
      }

      .memory-line {
        font-size: 8px;
        letter-spacing: 1.3px;
        line-height: 1.4;
      }

      .quote {
        min-height: 48px;
        margin-top: 8px;
        padding: 0 12px;
        font-size: clamp(15px, 4.4vw, 18px);
        line-height: 1.35;
      }

      .spotify-container {
        width: 100%;
        max-width: 500px;
        padding: 0;
      }

      .player-label {
        top: -18px;
        left: 12px;
        font-size: 7px;
        letter-spacing: 2px;
      }

      .spotify-glass {
        padding: 4px;
        border-radius: 16px;
        border: 1px solid rgba(255,235,200,.16);
      }

      .spotify-glass iframe {
        height: 152px;
        border-radius: 13px;
      }

      .footer {
        bottom: max(5px, env(safe-area-inset-bottom));
        font-size: 7px;
        padding: 0 10px;
      }

      .install-btn {
        top: max(11px, env(safe-area-inset-top));
        right: 11px;
        width: 34px;
        height: 34px;
        font-size: 16px;
        box-shadow: 0 4px 12px rgba(0,0,0,.28);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    /* Very small phones: prevent the Spotify card from crowding the screen. */
    @media (max-width: 380px), (max-height: 700px) {
      .page {
        padding-top: max(22px, env(safe-area-inset-top));
      }

      .title {
        font-size: clamp(38px, 14vw, 56px);
      }

      .subtitle {
        font-size: 14px;
      }

      .memory-line {
        font-size: 7.5px;
      }

      .quote {
        min-height: 40px;
        font-size: 14px;
      }

      .spotify-glass iframe {
        height: 145px;
      }
    }

    /* Respect users/devices that prefer fewer animations. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }

      .grain {
        display: none;
      }
    }


    /* Larger mobile Spotify player */
    @media (max-width: 700px) {
      .spotify-container {
        width: min(100%, 560px);
      }

      .spotify-glass {
        padding: 6px;
        border-radius: 19px;
      }

      .spotify-glass iframe {
        width: 100%;
        height: 190px;
        min-height: 190px;
        border-radius: 15px;
      }

      .player-label {
        top: -20px;
        left: 14px;
        font-size: 8px;
        letter-spacing: 2.2px;
      }
    }

    /* Keep the bigger player usable on short phones */
    @media (max-width: 380px) and (max-height: 700px) {
      .spotify-glass iframe {
        height: 175px;
        min-height: 175px;
      }
    }


    /* =========================================================
       MOBILE EDITION — separate layout + low-power rendering
       ========================================================= */

    @media (max-width: 700px) {
      html, body {
        width: 100%;
        min-height: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        background: #160f0a;
      }

      body {
        min-height: 100svh;
      }

      .background {
        position: fixed;
        inset: 0;
        transform: none;
        background-image:
          linear-gradient(rgba(20,12,7,.22), rgba(20,12,7,.70)),
          url("old-song-wala-mobile.webp");
        background-position: center center;
        background-size: cover;
        will-change: auto;
      }

      .overlay {
        background: linear-gradient(
          to bottom,
          rgba(0,0,0,.02),
          rgba(0,0,0,.48)
        );
      }

      /* Disable expensive full-screen effects on phones. */
      .grain {
        display: none !important;
        animation: none !important;
      }

      .page {
        width: 100%;
        min-height: 100svh;
        height: auto;
        padding:
          max(30px, env(safe-area-inset-top))
          16px
          max(26px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 0;
      }

      .header {
        width: 100%;
        padding-top: 8px;
        animation: none;
      }

      .small-label {
        margin-bottom: 9px;
        font-size: 8px;
        letter-spacing: 2.2px;
      }

      .title {
        font-size: clamp(44px, 14.5vw, 66px);
        line-height: .92;
        letter-spacing: -2px;
        text-shadow: 0 4px 18px rgba(0,0,0,.5);
      }

      .subtitle {
        margin-top: 9px;
        font-size: clamp(14px, 4.4vw, 18px);
        text-shadow: 0 2px 8px #000;
      }

      .heart {
        animation: none;
      }

      .memory {
        width: 100%;
        margin: 48px 0 34px;
        animation: none;
      }

      .memory-line {
        font-size: 8px;
        letter-spacing: 1.2px;
        line-height: 1.4;
      }

      .quote {
        min-height: 0;
        margin-top: 9px;
        padding: 0 8px;
        font-size: clamp(16px, 4.5vw, 20px);
        line-height: 1.35;
        transition: none;
        text-shadow: 0 2px 8px #000;
      }

      /* MOBILE PLAYER: Spotify gets its own larger vertical card. */
      .spotify-container {
        width: 100%;
        max-width: 520px;
        margin: 0 auto 28px;
        animation: none;
      }

      .player-label {
        position: static;
        margin: 0 0 8px 8px;
        font-size: 8px;
        letter-spacing: 2px;
      }

      .spotify-glass {
        width: 100%;
        padding: 5px;
        border-radius: 18px;
        background: rgba(20,14,10,.94);
        border: 1px solid rgba(255,235,200,.18);
        box-shadow: 0 12px 30px rgba(0,0,0,.42);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .spotify-glass iframe {
        display: block;
        width: 100%;
        height: 352px;
        min-height: 352px;
        border-radius: 14px;
      }

      .footer {
        position: static;
        width: 100%;
        transform: none;
        margin-top: auto;
        padding: 18px 0 4px;
        font-size: 8px;
      }

      .install-btn {
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        width: 34px;
        height: 34px;
        box-shadow: 0 4px 12px rgba(0,0,0,.3);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    /* Extra-small/short phones */
    @media (max-width: 380px) and (max-height: 740px) {
      .page {
        padding-left: 13px;
        padding-right: 13px;
      }

      .memory {
        margin-top: 34px;
        margin-bottom: 26px;
      }

      .spotify-glass iframe {
        height: 310px;
        min-height: 310px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

  </style>
</head>

<body>

  <!-- PWA INSTALL -->
  <button id="installBtn" class="install-btn" aria-label="Install app" title="Install App">⇩</button>

  <!-- Background image -->
  <div class="background"></div>

  <!-- Cinematic overlay -->
  <div class="overlay"></div>

  <!-- Film grain -->
  <div class="grain"></div>


  <main class="page">

    <!-- =====================================
         TITLE
    ====================================== -->

    <header class="header">

      <div class="small-label">
        ✦ A playlist for old souls ✦
      </div>

      <h1 class="title">
        Old Song Wala
      </h1>

      <div class="subtitle">
        Kuch yaadein, kuch geet... 
        <span class="heart">♥</span>
      </div>

    </header>


    <!-- =====================================
         MEMORY / QUOTES
    ====================================== -->

    <section class="memory">

      <div class="memory-line">
        Press play. Let the memories begin.
      </div>

      <div class="quote" id="quote">
        "Old songs are not old, they're memories that never fade."
      </div>

    </section>


    <!-- =====================================
         SPOTIFY PLAYLIST
    ====================================== -->

    <section class="spotify-container">

      <div class="player-label">
        Now playing · Old is Gold
      </div>

      <div class="spotify-glass">

        <iframe
          src="https://open.spotify.com/embed/playlist/37i9dQZF1DWYRTlrhMB12D?utm_source=generator&theme=0"
          allow="
            autoplay;
            clipboard-write;
            encrypted-media;
            fullscreen;
            picture-in-picture
          "
          loading="lazy">
        </iframe>

      </div>

    </section>


    <footer class="footer">
      Made with <span class="love-icon">♥</span> by
      <a href="https://github.com/lakshyap93" target="_blank" rel="noopener noreferrer">
        Lakshya Purohit
      </a>
    </footer>

  </main>


  <script>

    /* =========================================
       ROTATING NOSTALGIC QUOTES
    ========================================= */

    const quotes = [
      "Old songs are not old, they're memories that never fade.",
      "Kuch gaane sirf sune nahi jaate... mehsoos kiye jaate hain.",
      "Purane gaane, purani yaadein... aur wahi sukoon.",
      "Some melodies take you somewhere words never can.",
      "Ek gaana, hazaar yaadein.",
      "A good song doesn't age. It becomes a memory.",
      "Kabhi kabhi ek gaana poori kahaani suna deta hai.",
      "Woh zamaana hi kuch aur tha...",
      "Headphones lagao. Duniya bhool jao.",
      "Old music. Warm memories. Endless nights."
    ];

    const quoteElement = document.getElementById("quote");

    let quoteIndex = 0;

    setInterval(() => {

      quoteElement.style.opacity = "0";
      quoteElement.style.transform = "none";

      setTimeout(() => {

        quoteIndex++;

        if (quoteIndex >= quotes.length) {
          quoteIndex = 0;
        }

        quoteElement.textContent =
          `"${quotes[quoteIndex]}"`;

        quoteElement.style.opacity = "1";
        quoteElement.style.transform = "none";

      }, 500);

    }, 4500);


    /* =========================================
       KEYBOARD INTERACTION
       SPACE = SMALL SCREEN EFFECT
    ========================================= */

    document.addEventListener("keydown", function(event) {

      if (event.code === "Space") {

        event.preventDefault();

        document.body.animate(
          [
            {
              filter: "brightness(1)"
            },
            {
              filter: "brightness(1.15)"
            },
            {
              filter: "brightness(1)"
            }
          ],
          {
            duration: 350,
            easing: "ease-out"
          }
        );

      }

    });


    /* =========================================
       CLICK INTERACTION
    ========================================= */

    document.addEventListener("click", function(event) {

      if (window.matchMedia("(pointer: coarse)").matches) return;

      if (
        event.target.closest(".spotify-container") ||
        event.target.closest("iframe")
      ) {
        return;
      }

      const ripple = document.createElement("div");

      ripple.style.position = "fixed";
      ripple.style.left = event.clientX + "px";
      ripple.style.top = event.clientY + "px";
      ripple.style.width = "10px";
      ripple.style.height = "10px";
      ripple.style.borderRadius = "50%";
      ripple.style.border =
        "1px solid rgba(255,230,190,.5)";
      ripple.style.pointerEvents = "none";
      ripple.style.transform = "translate(-50%, -50%)";
      ripple.style.zIndex = "50";

      document.body.appendChild(ripple);

      ripple.animate(
        [
          {
            width: "10px",
            height: "10px",
            opacity: 0.8
          },
          {
            width: "180px",
            height: "180px",
            opacity: 0
          }
        ],
        {
          duration: 800,
          easing: "ease-out"
        }
      ).onfinish = () => {
        ripple.remove();
      };

    });

    /* PWA INSTALL */
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = "flex";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;

      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

  </script>

</body>
</html>
